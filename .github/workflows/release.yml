name: 🐳 Build and Push Docker Image 🦀

on:
  push:
    branches:
      - sudo
    paths-ignore:
      - '**/*.md'
      - .gitignore
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: theboringhumane/xemgo

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-ecosystem/action-release-label@v1
        id: release-label
        if: ${{ github.event.pull_request.merged == true }}

      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag

      - uses: actions-ecosystem/action-bump-semver@v1
        id: bump-semver
        with:
          current_version: ${{ steps.get-latest-tag.outputs.tag }}
          level: patch

      - name: Create a requirements.txt file
        run: |
          echo "names_generator" > requirements.txt
          echo "requests" >> requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Dockerlike release name
        id: dockerlike-release-name
        run: |
          DOCKERLIKE_RELEASE_NAME=$(python -c "from names_generator import generate_name; print(generate_name())")
          echo "DOCKERLIKE_RELEASE_NAME=${DOCKERLIKE_RELEASE_NAME}" >> $GITHUB_ENV

      - name: Get commits
        id: get_commits
        shell: sh
        run: |
          git fetch --tags
          LAST_TAG=${{ steps.get-latest-tag.outputs.tag }}
          COMMITS=$(git log --oneline --no-merges --pretty=format:"%s" ${LAST_TAG}..HEAD)
          COMMITS=$(echo "$COMMITS" | tr '\n' ';')
          echo "ALL_COMMITS=$COMMITS" >> $GITHUB_ENV

      - name: Generate Release notes
        id: generate-release-notes
        shell: sh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          DOCKERLIKE_RELEASE_NAME: ${{ env.DOCKERLIKE_RELEASE_NAME }}
          NEW_VERSION: ${{ steps.bump-semver.outputs.new_version }}
          COMMITS: ${{ env.ALL_COMMITS }}
        run: |
          echo "Generating release notes..."
          python3 scripts/generate-release-notes.py
          echo "Release notes generated"
      
      - name: Create a Release
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.DOCKERLIKE_RELEASE_NAME }}
          tag_name: ${{ steps.bump-semver.outputs.new_version }}
          body_path: release_notes.md

  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📝 Create build info
        shell: sh
        run: |
          echo "🏗️ Build Information\n\
          -------------------\n\
          🕒 Build Date: $(date)\n\
          🔄 Git Commit: $(git rev-parse HEAD)\n\
          🌿 Git Branch: $(git rev-parse --abbrev-ref HEAD)\n\
          📅 Build Timestamp: $(date)\n\
          🏷️ Version Hash: $(git rev-parse HEAD)" > ./public/build-info.txt

      - name: 🔑 Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Go compiler cache
        id: go-cache
        uses: actions/cache@v4
        with:
          path: go-build-cache
          key: docker-go-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            docker-go-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}-

      - name: Restore and save BuildKit cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"go-build-cache": "/root/.cache/go-build"}'
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}

      - name: 🏷️ Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Publish this architecture immediately; the combined tag is updated later.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          sbom: false
          provenance: false

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: [create-release, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${images[@]}"
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag"
          done <<< "$TAGS"
